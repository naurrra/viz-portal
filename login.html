<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | Company</title>
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth">
<main class="auth-wrap">
  <div class="auth-card">
    <a class="auth-logo" href="index.html">
      <img src="img/logo.png" alt="Company Logo">
    </a>

    <form class="auth-form" data-demo-login novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="field-control">
          <input type="password" id="password" name="password" autocomplete="current-password">
          <button type="button" class="field-toggle" data-toggle-password="password" aria-label="Tampilkan password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn--accent auth-submit">Sign In</button>
    </form>
  </div>
</main>
  <script src="js/auth.js"></script>
</body>
</html>
